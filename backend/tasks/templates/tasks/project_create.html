<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создать проект</title>
</head>
<body>

<h1>Создать проект</h1>

<form method="post">

    {% csrf_token %}

    <label>
        Название
    </label>

    <input
        type="text"
        name="title"
        required
    >

    <br><br>

    <label>
        Описание
    </label>

    <textarea name="description"></textarea>

    <br><br>

    <button type="submit">
        Создать
    </button>

</form>

<a href="{% url 'project_list' %}">
    Отмена
</a>

</body>
</html>
