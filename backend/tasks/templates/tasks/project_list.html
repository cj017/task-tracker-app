<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мои проекты</title>
</head>
<body>

<h1>Мои проекты</h1>

<a href="{% url 'project_create' %}">
    + Создать проект
</a>

<hr>

{% for project in projects %}

    <h2>{{ project.title }}</h2>

    <p>{{ project.description }}</p>

    <a href="{% url 'task_list' project.id %}">
    Открыть задачи
    </a>

    <a href="{% url 'project_update' project.id %}">
    Редактировать
    </a>
    
    <a href="{% url 'project_delete' project.id %}">
        Удалить
    </a>

{% empty %}

    <p>У вас пока нет проектов.</p>

{% endfor %}

<br>

<a href="{% url 'dashboard' %}">
    ← Dashboard
</a>

</body>
</html>
